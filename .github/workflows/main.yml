name: Run Main Automation

on:
  workflow_dispatch:
  schedule:
    # الساعة 9:00 صباحاً بتوقيت مصر (UTC+2) = 07:00 UTC
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pip.txt'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies from pip.txt
        run: |
          python -m pip install --upgrade pip
          if [ -f pip.txt ]; then
            pip install -r pip.txt
          fi

      - name: Run main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_SECRET_JSON_AR_ABDO_AI: ${{ secrets.YT_CLIENT_SECRET_JSON_AR_ABDO_AI }}
          YT_CLIENT_SECRET_JSON_AR_ABDO_ECONOMY: ${{ secrets.YT_CLIENT_SECRET_JSON_AR_ABDO_ECONOMY }}
          YT_CLIENT_SECRET_JSON_AR_AL_QESA: ${{ secrets.YT_CLIENT_SECRET_JSON_AR_AL_QESA }}
          YT_CLIENT_SECRET_JSON_AR_ASAMIRTECH: ${{ secrets.YT_CLIENT_SECRET_JSON_AR_ASAMIRTECH }}
          YT_TOKEN_AR_ABDO_AI: ${{ secrets.YT_TOKEN_AR_ABDO_AI }}
          YT_TOKEN_AR_ABDO_ECONOMY: ${{ secrets.YT_TOKEN_AR_ABDO_ECONOMY }}
          YT_TOKEN_AR_AL_QESA: ${{ secrets.YT_TOKEN_AR_AL_QESA }}
          YT_TOKEN_AR_ASAMIRTECH: ${{ secrets.YT_TOKEN_AR_ASAMIRTECH }}
        run: python main.py

      - name: Commit and Push Input Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r --cached "**/__pycache__" 2>/dev/null || true
          git add input/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: update input files [skip ci]"
            git pull --rebase origin main
            git push
          fi